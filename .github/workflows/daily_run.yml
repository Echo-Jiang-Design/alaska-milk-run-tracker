name: Daily Alaska Weather Tracker

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  check-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Weather Tracker
        run: python tracker.py
